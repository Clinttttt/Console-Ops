@let item = workflow();
@let run = item.latestRun;

<div class="row" [class.is-selected]="selected()">
  <button type="button" class="pick" (click)="select()">
    <span class="glyph" aria-hidden="true">
      <co-icon [name]="icon()" [size]="17" />
    </span>

    <span class="identity">
      <span class="name">{{ item.name }}</span>
      <span class="sub">
        @if (item.classification === 'deployment') {
          <!--
            Named only because an operator registered this file as the project's deployment workflow, never
            because the name sounds like one. It names no environment: Console Ops records the workflow against
            the project, and naming an environment would be inventing that link.
          -->
          Primary deployment
        } @else if (item.state === 'disabled') {
          <span class="co-unavailable">Disabled at the provider</span>
        } @else {
          <span class="co-unavailable">Unclassified</span>
        }
      </span>
    </span>

    <span class="state">
      @if (run === null) {
        <span class="co-unavailable">No run recorded</span>
      } @else {
        <co-status [cell]="runCell()" [showDetail]="false" />
        <span class="when co-unavailable">
          {{ run.completedAt ?? run.startedAt | coRelativeTime: readAt() }}
        </span>
      }
    </span>

    <span class="source co-mono">
      @if (run === null) {
        <span class="co-unavailable">&mdash;</span>
      } @else {
        {{ run.branch }}
        <span class="sep" aria-hidden="true">|</span>
        {{ run.commitShortSha }}
        <span class="sep" aria-hidden="true">|</span>
        {{ trigger(run.trigger) }}
      }
    </span>
  </button>

  <span class="actions">
    <!--
      Two actions and no dead ends: Logs opens this workflow's runs, and Run asks for one. The provider's raw
      execution log text is not rendered yet, so nothing here claims to show it.
    -->
    <a class="co-inline-link" [routerLink]="['/workflows', projectId(), item.id, 'runs']">Logs</a>

    @if (awaitingRun()) {
      <!-- Accepted by the provider, which reports no run yet: saying "running" would be claiming one exists. -->
      <span
        class="run is-pending"
        title="The provider accepted the request and has not reported a run yet"
      >
        Requested
      </span>
    } @else if (item.executable) {
      <button type="button" class="run" (click)="requestRun.emit(workflow())">Run</button>
    } @else {
      <span
        class="run is-unavailable"
        [title]="
          item.risk === 'unclassified'
            ? 'Mark this workflow\'s risk before Console Ops will run it'
            : 'The provider reports this workflow as disabled'
        "
      >
        Run
      </span>
    }
  </span>
</div>
