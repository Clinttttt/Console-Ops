<div class="heading">
  <h1>{{ title() }}</h1>
  @if (subtitle() !== null) {
    <p class="subtitle">{{ subtitle() }}</p>
  }
</div>

<div class="controls">
  <div class="scope">
    <button
      type="button"
      class="scope-trigger"
      (click)="toggleScope()"
      [attr.aria-expanded]="scopeOpen()"
      aria-haspopup="listbox"
    >
      <span class="co-dot" data-level="healthy"></span>
      <span>{{ scopeLabel() }}</span>
      <co-icon name="chevronDown" [size]="15" />
    </button>

    @if (scopeOpen()) {
      <ul class="scope-menu" role="listbox" [attr.aria-label]="'Environment scope'">
        @for (option of options; track option.label) {
          <li>
            <button
              type="button"
              role="option"
              [attr.aria-selected]="option.value === scope()"
              class="scope-option"
              [class.is-selected]="option.value === scope()"
              (click)="selectScope(option.value)"
            >
              {{ option.label }}
            </button>
          </li>
        }
      </ul>
    }
  </div>

  <div class="search">
    <co-icon name="search" [size]="15" />
    <label class="co-sr-only" for="co-search">Search projects and deployments</label>
    <input id="co-search" type="search" placeholder="Search projects, deployments..." />
    <span class="shortcut" aria-hidden="true">Ctrl K</span>
  </div>

  <button type="button" class="icon-button" [attr.aria-label]="'Notifications'">
    <co-icon name="bell" [size]="17" />
    @if (notificationCount > 0) {
      <span class="badge">{{ notificationCount }}</span>
    }
  </button>

  <button type="button" class="operator" aria-haspopup="menu">
    <span class="avatar" aria-hidden="true">{{ operatorInitials }}</span>
    <span class="operator-name">{{ operatorName }}</span>
    <co-icon name="chevronDown" [size]="15" />
  </button>
</div>
