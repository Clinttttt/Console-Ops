name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: repos/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Backend.slnx

      - name: Build
        run: dotnet build Backend.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Backend.slnx --configuration Release --no-build --no-restore
