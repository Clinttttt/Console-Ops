name: Deploy ConsoleOps API

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ vars.AZURE_ACR }}"

      # The schema is brought forward before the new image serves traffic. A migration that fails stops the job
      # here, so the previous revision keeps answering rather than a new one meeting a database it does not match.
      # This exists because it already went wrong: sign-in shipped while `operator_sessions` was missing in
      # production, and the callback answered 500 after GitHub had already authorized the operator.
      - name: Check the schema step is configured
        env:
          # Through the environment rather than interpolated into the script: a value substituted into shell source
          # is a value that can end the quoting and run something else.
          DB_CONNECTION: ${{ secrets.PROD_DB_CONNECTION }}
        run: |
          if [ -z "${DB_CONNECTION}" ]; then
            echo "::error::PROD_DB_CONNECTION is not set. The schema cannot be brought forward, and deploying an" \
                 "image against a database it does not match is what this step exists to prevent. Add the secret," \
                 "then re-run. Setup guide section 10.5 has the details."
            exit 1
          fi

      # Opening the firewall is best effort. GitHub-hosted runners may already be reachable through the server's
      # "allow Azure services" rule, and a deployment identity without permission to manage rules should not block a
      # migration that would have worked anyway. What must succeed is the migration itself, so only that fails the job.
      - name: Open the database to this runner
        id: database-access
        if: vars.AZURE_POSTGRES_SERVER != ''
        continue-on-error: true
        env:
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          server="subscriptions/${SUBSCRIPTION}/resourceGroups/${RESOURCE_GROUP}"
          server="${server}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${POSTGRES_SERVER}"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          rule="ci-${RUN_ID}"

          # The ARM API rather than `az postgres flexible-server firewall-rule`, whose flags were renamed under us:
          # the runner's CLI made --server-name required and repurposed --name, and the step failed on usage alone.
          cat > firewall-rule.json <<JSON
          {"properties":{"startIpAddress":"${runner_ip}","endIpAddress":"${runner_ip}"}}
          JSON

          az rest --method put \
            --url "https://management.azure.com/${server}/firewallRules/${rule}?api-version=2024-08-01" \
            --headers "Content-Type=application/json" \
            --body @firewall-rule.json \
            --output none
          rm -f firewall-rule.json

          # Recorded only once the rule exists, so cleanup never chases something that was never created.
          echo "rule=$rule" >> "$GITHUB_OUTPUT"

          # Creating a rule is asynchronous; connecting before it applies looks exactly like being blocked.
          for _ in $(seq 1 24); do
            state="$(az rest --method get \
              --url "https://management.azure.com/${server}/firewallRules/${rule}?api-version=2024-08-01" \
              --query "properties.provisioningState" --output tsv 2>/dev/null || true)"
            if [ "$state" = "Succeeded" ]; then
              echo "Firewall rule $rule is in place."
              exit 0
            fi
            sleep 5
          done

          echo "::warning::Firewall rule $rule did not report Succeeded within two minutes."

      - name: Apply database migrations
        env:
          # Passed as configuration rather than on the command line, so the connection string is never an argument
          # in a process list or a log line.
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_DB_CONNECTION }}
        run: |
          # The repository pins dotnet-ef in .config/dotnet-tools.json, so it is restored rather than installed.
          # A global install does not help here: once a manifest exists, `dotnet ef` resolves to the local tool and
          # ignores the global one. Restoring also keeps the version in one place instead of here as well.
          dotnet tool restore

          # Built once, explicitly, before either command runs. A fresh checkout has no obj/project.assets.json, and
          # `dotnet ef` reads project metadata through MSBuild rather than restoring for itself - it reported the
          # missing assets file as "unable to retrieve project metadata", which does not sound like a restore.
          # Building the startup project also builds Infrastructure, so --no-build then covers both commands and the
          # same output is used twice instead of being rebuilt per command.
          dotnet build repos/backend/ConsoleOps.Api/ConsoleOps.Api.csproj --configuration Release

          dotnet ef migrations list \
            --project repos/backend/ConsoleOps.Infrastructure \
            --startup-project repos/backend/ConsoleOps.Api \
            --configuration Release \
            --no-build
          dotnet ef database update \
            --project repos/backend/ConsoleOps.Infrastructure \
            --startup-project repos/backend/ConsoleOps.Api \
            --configuration Release \
            --no-build

      # Always removed, including when the migration failed: a standing rule for a runner IP that no longer exists
      # is an opening nobody is watching.
      - name: Close the database to this runner
        if: always() && steps.database-access.outputs.rule != ''
        env:
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}
          RULE: ${{ steps.database-access.outputs.rule }}
        run: |
          set -euo pipefail
          server="subscriptions/${SUBSCRIPTION}/resourceGroups/${RESOURCE_GROUP}"
          server="${server}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${POSTGRES_SERVER}"
          az rest --method delete \
            --url "https://management.azure.com/${server}/firewallRules/${RULE}?api-version=2024-08-01" \
            --output none

      - name: Build and push container image
        run: |
          dotnet publish repos/backend/ConsoleOps.Api/ConsoleOps.Api.csproj \
            --configuration Release \
            --os linux \
            --arch x64 \
            /t:PublishContainer \
            -p:ContainerRegistry=${{ vars.AZURE_ACR }}.azurecr.io \
            -p:ContainerRepository=consoleops-api \
            -p:ContainerImageTag=${{ github.event.workflow_run.head_sha }} \
            -p:SourceRevisionId=${{ github.event.workflow_run.head_sha }}

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-name "console-ops-container" \
            --image "${{ vars.AZURE_ACR }}.azurecr.io/consoleops-api:${{ github.event.workflow_run.head_sha }}"

      - name: Verify deployment
        run: |
          az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.runningStatus" \
            --output tsv
