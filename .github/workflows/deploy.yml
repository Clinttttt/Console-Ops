name: Deploy ConsoleOps API

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ vars.AZURE_ACR }}"

      - name: Build and push container image
        run: |
          dotnet publish repos/backend/ConsoleOps.Api/ConsoleOps.Api.csproj \
            --configuration Release \
            --os linux \
            --arch x64 \
            /t:PublishContainer \
            -p:ContainerRegistry=${{ vars.AZURE_ACR }}.azurecr.io \
            -p:ContainerRepository=consoleops-api \
            -p:ContainerImageTag=${{ github.event.workflow_run.head_sha }}

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-name "console-ops-container" \
            --image "${{ vars.AZURE_ACR }}.azurecr.io/consoleops-api:${{ github.event.workflow_run.head_sha }}"

      - name: Verify deployment
        run: |
          az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.runningStatus" \
            --output tsv
